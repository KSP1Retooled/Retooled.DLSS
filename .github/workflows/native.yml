name: Native plug-in

# Whenever the native plug-in's source changes, build Retooled.DLSS.Native.dll and commit it to the branch that changed.

on:
  push:
    branches: ['**']
    paths:
      - 'Native~/CMakeLists.txt'
      - 'Native~/src/**'
      - 'Native~/test/**'
      - 'Native~/unity/**'
      - 'Native~/build.ps1'
      - 'Native~/fetch-sdk.ps1'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces an older run, so the binary always comes from the newest source.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  # The plug-in only needs the Vulkan headers, so it builds against Khronos' header repository instead of the SDK.
  VULKAN_HEADERS: v1.4.363

jobs:
  build:
    name: Build on Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      # The runner has LLVM's clang-cl and the Windows SDK, which build.ps1 needs, but not Ninja.
      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }

      - name: Get the Vulkan headers
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch $env:VULKAN_HEADERS https://github.com/KhronosGroup/Vulkan-Headers.git "$env:RUNNER_TEMP/vulkan-headers"

      # build.ps1 downloads the Streamline headers with fetch-sdk.ps1 first. The harness needs an RTX GPU, which
      # the runner doesn't have, so it is built but not run.
      - name: Build
        shell: pwsh
        run: Native~/build.ps1 -VulkanInclude "$env:RUNNER_TEMP/vulkan-headers/include"

      - uses: actions/upload-artifact@v7
        with:
          name: native-windows
          path: Plugins/x86_64/Retooled.DLSS.Native.dll
          retention-days: 7

  # Commits the binary to the branch that changed. The fetched Streamline DLLs are git-ignored, so only the plug-in
  # goes in.
  commit:
    name: Commit the binary
    needs: build
    if: github.ref_type == 'branch'
    permissions:
      contents: write
    uses: KSP1Retooled/upm/.github/workflows/commit-binaries.yml@main
    with:
      artifacts: native-*
      path: Plugins/x86_64
