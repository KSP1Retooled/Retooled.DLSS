name: Publish to UPM

# When a release is published, pack the Unity package with the native plug-in and NVIDIA's Streamline DLLs, sign it,
# attach the signed .tgz to the release, and add the release to the KSP1Retooled registry
# (https://ksp1retooled.github.io/upm/). The steps come from KSP1Retooled/upm. To publish an existing release again,
# run update.yml there with this repo and the tag.

on:
  release:
    types: [published]

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  pack:
    name: Pack the package
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: KSP1Retooled/upm/check-release@main
        with:
          tag: ${{ env.TAG }}
          source: |
            Native~/CMakeLists.txt
            Native~/src
            Native~/unity
          binaries: Plugins/x86_64/Retooled.DLSS.Native.dll

      # NVIDIA's files are not in the repository. fetch-sdk.ps1 puts the DLLs and their .meta files in Plugins/x86_64
      # and Streamline's license in Native~/streamline. It fetches the DLSS runtime too, which .npmignore leaves out.
      - name: Fetch the Streamline SDK
        shell: pwsh
        run: Native~/fetch-sdk.ps1

      # .npmignore replaces .gitignore for npm, so the fetched Streamline DLLs go into the package. NVIDIA's license
      # covers distributing the DLSS runtime as part of an application, so no nvngx file may.
      - id: pack
        uses: KSP1Retooled/upm/pack@main
        with:
          expect: |
            Plugins/x86_64/Retooled.DLSS.Native.dll
            Plugins/x86_64/Retooled.DLSS.Native.dll.meta
            Plugins/x86_64/sl.interposer.dll
            Plugins/x86_64/sl.interposer.dll.meta
            Plugins/x86_64/sl.common.dll
            Plugins/x86_64/sl.common.dll.meta
            Plugins/x86_64/sl.dlss.dll
            Plugins/x86_64/sl.dlss.dll.meta
            Native~/streamline/license.txt
          forbid: nvngx

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ steps.pack.outputs.path }}

  sign:
    name: Sign the package
    needs: pack
    runs-on: self-hosted
    container:
      image: ghcr.io/ksp1retooled/ksp-ci:1
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ runner.temp }}/package

      - id: sign
        uses: KSP1Retooled/upm/sign@main
        with:
          tarball: ${{ runner.temp }}/package/${{ needs.pack.outputs.filename }}
          organization-id: ${{ vars.UPM_ORG_ID }}
          key-id: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          key: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY }}

      - name: Attach the signed package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.path }}
        run: gh release upload --repo "$GITHUB_REPOSITORY" -- "$TAG" "$SIGNED"

  publish:
    name: Publish to the registry
    needs: sign
    permissions:
      contents: read
    uses: KSP1Retooled/upm/.github/workflows/publish.yml@main
    with:
      tag: ${{ github.event.release.tag_name }}
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
